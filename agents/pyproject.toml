[project]
name = "hive-agents"
version = "0.0.0"
description = "HiveForYou DSPy study agents service"
requires-python = ">=3.11"
dependencies = [
  "dspy",
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hive_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
