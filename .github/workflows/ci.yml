name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  committed-env:
    name: Committed env guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:committed-env

  app:
    name: App build
    runs-on: ubuntu-latest
    needs: committed-env
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hiveforyou/app build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-key-placeholder
          SUPABASE_SERVICE_ROLE_KEY: service-role-placeholder
          HIVE_STORAGE_BUCKET: case-documents
          HIVE_DISCOVER_PROMPT_VERSION: discover-v2