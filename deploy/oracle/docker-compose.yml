services:
  hive-worker:
    build:
      context: ../..
      dockerfile: worker/Dockerfile
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - worker.config.env
      - /etc/hive-worker/worker.env

  hive-agents:
    build:
      context: ../..
      dockerfile: agents/Dockerfile
    platform: linux/arm64
    network_mode: "service:hive-worker"
    depends_on:
      hive-worker:
        condition: service_started
    restart: unless-stopped
    env_file:
      - agents.config.env
      - /etc/hive-worker/worker.env
    environment:
      MODEL_PROVIDER: anthropic
      MODEL_NAME: claude-opus-5-5
